name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage static site & verify < 850 MiB capacity
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='.sync_state.json' --exclude='_site' ./ _site/
          SITE_MIB=$(du -sm _site | awk '{print $1}')
          echo "Initial _site size: ${SITE_MIB} MiB"
          if [ "$SITE_MIB" -ge 800 ]; then
            echo "Offloading bulk image folders to GitHub Raw CDN fallback to stay under 850 MiB..."
            rm -rf _site/assets _site/*-images
            SITE_MIB=$(du -sm _site | awk '{print $1}')
            echo "Post-offload _site size: ${SITE_MIB} MiB"
          fi
          if [ "$SITE_MIB" -ge 850 ]; then
            echo "::error::_site (${SITE_MIB} MiB) exceeds 850 MiB safety ceiling"
            exit 1
          fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
